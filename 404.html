<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found | Green Energy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

/*==============================
RESET
===============================*/

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Poppins',sans-serif;
overflow-x:hidden;
min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(135deg,
#0b3d20,
#0f5d2d,
#198754,
#22c55e);

position:relative;

}

/*==============================
BACKGROUND GLOW
===============================*/

body::before{

content:"";

position:absolute;

width:700px;
height:700px;

background:#7CFC00;

filter:blur(220px);

top:-300px;
left:-250px;

opacity:.18;

animation:moveGlow1 15s linear infinite;

}

body::after{

content:"";

position:absolute;

width:650px;
height:650px;

background:#16a34a;

filter:blur(180px);

bottom:-250px;
right:-200px;

opacity:.25;

animation:moveGlow2 18s linear infinite;

}

@keyframes moveGlow1{

0%{
transform:translate(0,0);
}

50%{
transform:translate(120px,80px);
}

100%{
transform:translate(0,0);
}

}

@keyframes moveGlow2{

0%{
transform:translate(0,0);
}

50%{
transform:translate(-100px,-80px);
}

100%{
transform:translate(0,0);
}

}

/*==============================
FLOATING PARTICLES
===============================*/

.particles{

position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:0;

}

.particles span{

position:absolute;

display:block;

border-radius:50%;

background:rgba(255,255,255,.25);

animation:floatParticle linear infinite;

}

@keyframes floatParticle{

0%{

transform:translateY(100vh) scale(0);

opacity:0;

}

20%{

opacity:.8;

}

100%{

transform:translateY(-100px) scale(1);

opacity:0;

}

}

/*==============================
MAIN CARD
===============================*/

.container{

position:relative;

z-index:10;

width:92%;
max-width:1200px;

background:rgba(255,255,255,.08);

border:1px solid rgba(255,255,255,.18);

backdrop-filter:blur(16px);

border-radius:35px;

padding:70px 60px;

display:flex;
align-items:center;
justify-content:space-between;
gap:60px;

box-shadow:

0 25px 70px rgba(0,0,0,.25);

}

/*==============================
LEFT CONTENT
===============================*/

.content{

flex:1;

animation:leftFade 1s ease;

}

@keyframes leftFade{

from{

opacity:0;
transform:translateX(-80px);

}

to{

opacity:1;
transform:translateX(0);

}

}

.badge{

display:inline-flex;

align-items:center;

gap:8px;

padding:12px 22px;

border-radius:40px;

background:rgba(34,197,94,.18);

border:1px solid rgba(255,255,255,.2);

color:#e8ffe8;

font-weight:600;

margin-bottom:25px;

}

.badge i{

color:#98fb98;

}

.error{

font-size:8rem;

font-weight:800;

line-height:1;

color:#fff;

margin-bottom:10px;

text-shadow:

0 8px 30px rgba(0,0,0,.25);

}

.title{

font-size:42px;

font-weight:700;

color:#fff;

margin-bottom:20px;

}

.description{

font-size:17px;

line-height:1.9;

color:#eefbef;

max-width:560px;

margin-bottom:40px;

}

/*==============================
BUTTONS
===============================*/

.buttons{

display:flex;

flex-wrap:wrap;

gap:18px;

}

.btn{

padding:17px 34px;

border:none;

border-radius:50px;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.35s;

text-decoration:none;

display:inline-flex;

align-items:center;

gap:10px;

}

.home-btn{

background:#22c55e;

color:#fff;

box-shadow:

0 12px 30px rgba(34,197,94,.45);

}

.home-btn:hover{

transform:translateY(-5px);

background:#16a34a;

}

.back-btn{

background:rgba(255,255,255,.12);

color:#fff;

border:1px solid rgba(255,255,255,.2);

}

.back-btn:hover{

background:#fff;

color:#198754;

transform:translateY(-5px);

}

/*==============================
RIGHT SIDE
===============================*/

.illustration{

flex:1;

display:flex;

justify-content:center;

align-items:center;

position:relative;

animation:rightFade 1.2s ease;

}

@keyframes rightFade{

from{

opacity:0;
transform:translateX(100px);

}

to{

opacity:1;
transform:translateX(0);

}

}

.energy-circle{

width:420px;
height:420px;

border-radius:50%;

background:

radial-gradient(circle at center,

#b9ffcb 0%,

#66d97d 35%,

#22c55e 70%,

#0f5132 100%);

position:relative;

display:flex;

justify-content:center;

align-items:center;

box-shadow:

0 0 60px rgba(34,197,94,.45);

overflow:hidden;

}

/*==============================
GROUND
===============================*/

.ground{

position:absolute;

bottom:55px;

width:320px;
height:18px;

background:#1d6b35;

border-radius:20px;

}

/*==============================
SOLAR PANEL
===============================*/

.solar{

position:absolute;

bottom:70px;

left:60px;

width:120px;
height:80px;

background:#17406f;

border:5px solid #0d2e4d;

border-radius:8px;

transform:skew(-12deg);

overflow:hidden;

}

.solar::before{

content:"";

position:absolute;

left:0;
top:0;

width:100%;
height:100%;

background:

repeating-linear-gradient(
90deg,
transparent 0,
transparent 18px,
rgba(255,255,255,.35) 18px,
rgba(255,255,255,.35) 20px
),

repeating-linear-gradient(
transparent 0,
transparent 18px,
rgba(255,255,255,.35) 18px,
rgba(255,255,255,.35) 20px
);

}

.solar-stand{

position:absolute;

width:10px;
height:55px;

background:#444;

bottom:20px;

left:110px;

}
/*====================================
WIND TURBINE
====================================*/

.turbine{

position:absolute;
right:105px;
bottom:70px;

display:flex;
justify-content:center;
align-items:flex-end;

}

.tower{

width:10px;
height:170px;

background:linear-gradient(to bottom,#ffffff,#d8d8d8);

border-radius:10px;

position:relative;

}

.hub{

position:absolute;

top:-12px;
left:50%;

transform:translateX(-50%);

width:18px;
height:18px;

background:#ffffff;

border-radius:50%;

z-index:5;

}

.blade{

position:absolute;

top:-6px;
left:50%;

width:95px;
height:8px;

background:#ffffff;

border-radius:50px;

transform-origin:left center;

}

.blade:nth-child(2){
transform:rotate(0deg);
}

.blade:nth-child(3){
transform:rotate(120deg);
}

.blade:nth-child(4){
transform:rotate(240deg);
}

.rotor{

position:absolute;

top:0;
left:50%;

width:0;
height:0;

animation:rotateBlade 4s linear infinite;

}

@keyframes rotateBlade{

from{
transform:translateX(-50%) rotate(0deg);
}

to{
transform:translateX(-50%) rotate(360deg);
}

}

/*====================================
SUN
====================================*/

.sun{

position:absolute;

top:55px;
right:70px;

width:70px;
height:70px;

border-radius:50%;

background:#ffe066;

box-shadow:
0 0 25px rgba(255,224,102,.7),
0 0 70px rgba(255,224,102,.4);

animation:sunGlow 3s ease-in-out infinite;

}

@keyframes sunGlow{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

}

/*====================================
CLOUDS
====================================*/

.cloud{

position:absolute;

background:#ffffff;

border-radius:100px;

opacity:.9;

animation:cloudMove linear infinite;

}

.cloud::before,
.cloud::after{

content:"";

position:absolute;

background:#ffffff;

border-radius:50%;

}

.cloud1{

top:70px;
left:-120px;

width:120px;
height:45px;

animation-duration:28s;

}

.cloud1::before{

width:55px;
height:55px;

left:12px;
top:-25px;

}

.cloud1::after{

width:60px;
height:60px;

right:10px;
top:-30px;

}

.cloud2{

top:150px;
right:-150px;

width:150px;
height:55px;

animation-duration:34s;

animation-direction:reverse;

}

.cloud2::before{

width:60px;
height:60px;

left:18px;
top:-25px;

}

.cloud2::after{

width:70px;
height:70px;

right:12px;
top:-35px;

}

@keyframes cloudMove{

0%{

transform:translateX(0);

}

100%{

transform:translateX(1500px);

}

}

/*====================================
TREES
====================================*/

.tree{

position:absolute;
bottom:70px;

}

.tree1{

left:210px;

}

.tree2{

right:45px;

transform:scale(.9);

}

.trunk{

width:12px;
height:45px;

background:#6b3f22;

margin:auto;

}

.leaves{

width:55px;
height:55px;

background:#1fb455;

border-radius:50%;

margin-bottom:-8px;

box-shadow:

0 -15px 0 #2ecc71,
-18px 10px 0 #27ae60,
18px 10px 0 #22c55e;

}

/*====================================
FLOATING LEAVES
====================================*/

.leaf{

position:absolute;

font-size:24px;

color:#bbf7d0;

opacity:.75;

animation:leafFloat linear infinite;

}

.leaf:nth-child(1){

left:5%;
top:20%;
animation-duration:10s;

}

.leaf:nth-child(2){

left:25%;
top:10%;
animation-duration:12s;

}

.leaf:nth-child(3){

left:75%;
top:15%;
animation-duration:11s;

}

.leaf:nth-child(4){

left:90%;
top:30%;
animation-duration:14s;

}

@keyframes leafFloat{

0%{

transform:translateY(0) rotate(0deg);

}

50%{

transform:translateY(40px) rotate(180deg);

}

100%{

transform:translateY(0) rotate(360deg);

}

}

/*====================================
RESPONSIVE
====================================*/

@media(max-width:1100px){

.container{

flex-direction:column;

text-align:center;

padding:60px 40px;

}

.description{

margin:auto;
margin-bottom:35px;

}

.buttons{

justify-content:center;

}

.energy-circle{

width:360px;
height:360px;

}

.error{

font-size:6rem;

}

.title{

font-size:34px;

}

}

@media(max-width:768px){

.container{

padding:45px 25px;

border-radius:25px;

}

.energy-circle{

width:300px;
height:300px;

}

.error{

font-size:5rem;

}

.title{

font-size:28px;

}

.description{

font-size:15px;

}

.btn{

width:100%;
justify-content:center;

}

.buttons{

flex-direction:column;

}

.sun{

width:55px;
height:55px;

}

}

@media(max-width:480px){

.energy-circle{

width:250px;
height:250px;

}

.error{

font-size:4rem;

}

.title{

font-size:22px;

}

.description{

font-size:14px;
line-height:1.7;

}

.badge{

font-size:13px;

padding:10px 18px;

}

.solar{

transform:scale(.75) skew(-12deg);

left:35px;

}

.turbine{

transform:scale(.72);

right:40px;

}

.tree1{

left:150px;

}

.tree2{

right:15px;

}

}

</style>
</head>

<body>

<div class="particles"></div>

<i class="fa-solid fa-leaf leaf"></i>
<i class="fa-solid fa-leaf leaf"></i>
<i class="fa-solid fa-leaf leaf"></i>
<i class="fa-solid fa-leaf leaf"></i>

<div class="container">

<div class="content">

<span class="badge">
<i class="fa-solid fa-seedling"></i>
Renewable Energy
</span>

<h1 class="error">404</h1>

<h2 class="title">
Oops! Energy Not Found
</h2>

<p class="description">
The page you're looking for has gone off the grid. Let's help you get back to exploring clean, sustainable, and renewable energy solutions.
</p>

<div class="buttons">

<a href="index.html" class="btn home-btn">
<i class="fa-solid fa-house"></i>
Back to Home
</a>

<button class="btn back-btn" onclick="history.back()">
<i class="fa-solid fa-arrow-left"></i>
Previous Page
</button>

</div>

</div>

<div class="illustration">

<div class="energy-circle">

<div class="sun"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="ground"></div>

<div class="solar"></div>
<div class="solar-stand"></div>

<div class="turbine">

<div class="tower">

<div class="rotor">

<div class="hub"></div>

<div class="blade"></div>
<div class="blade"></div>
<div class="blade"></div>

</div>

</div>

</div>

<div class="tree tree1">

<div class="leaves"></div>
<div class="trunk"></div>

</div>

<div class="tree tree2">

<div class="leaves"></div>
<div class="trunk"></div>

</div>

</div>

</div>

</div>

<script>
    /*=========================================
      FLOATING PARTICLES
    =========================================*/
    
    const particles = document.querySelector(".particles");
    
    // Number of particles based on screen size
    const particleCount = window.innerWidth < 768 ? 30 : 60;
    
    for (let i = 0; i < particleCount; i++) {
    
        const span = document.createElement("span");
    
        const size = Math.random() * 8 + 2;
    
        span.style.width = size + "px";
        span.style.height = size + "px";
    
        span.style.left = Math.random() * 100 + "%";
    
        span.style.animationDuration = (Math.random() * 10 + 8) + "s";
    
        span.style.animationDelay = Math.random() * 8 + "s";
    
        span.style.opacity = Math.random() * 0.6 + 0.2;
    
        particles.appendChild(span);
    }
    
    /*=========================================
      PAGE LOAD ANIMATION
    =========================================*/
    
    window.addEventListener("load", () => {
    
        document.body.style.opacity = "1";
    
    });
    
    /*=========================================
      PARALLAX EFFECT
    =========================================*/
    
    const circle = document.querySelector(".energy-circle");
    
    document.addEventListener("mousemove", (e) => {
    
        const x = (window.innerWidth / 2 - e.clientX) / 35;
        const y = (window.innerHeight / 2 - e.clientY) / 35;
    
        circle.style.transform =
            `translate(${x}px, ${y}px)`;
    
    });
    
    /*=========================================
      BUTTON RIPPLE EFFECT
    =========================================*/
    
    document.querySelectorAll(".btn").forEach(button => {
    
        button.addEventListener("click", function(e){
    
            const ripple = document.createElement("span");
    
            ripple.classList.add("ripple");
    
            const rect = this.getBoundingClientRect();
    
            ripple.style.left = (e.clientX - rect.left) + "px";
            ripple.style.top = (e.clientY - rect.top) + "px";
    
            this.appendChild(ripple);
    
            setTimeout(()=>{
                ripple.remove();
            },600);
    
        });
    
    });
    
    /*=========================================
      RANDOM LEAF MOVEMENT
    =========================================*/
    
    document.querySelectorAll(".leaf").forEach(leaf=>{
    
        setInterval(()=>{
    
            const rotate = Math.random()*360;
    
            const x = Math.random()*25-12;
    
            const y = Math.random()*25-12;
    
            leaf.style.transform =
            `translate(${x}px,${y}px) rotate(${rotate}deg)`;
    
        },2500);
    
    });
    
    /*=========================================
      ENERGY PULSE
    =========================================*/
    
    setInterval(()=>{
    
        circle.animate([
    
            {
                boxShadow:"0 0 40px rgba(34,197,94,.45)"
            },
    
            {
                boxShadow:"0 0 80px rgba(34,197,94,.8)"
            },
    
            {
                boxShadow:"0 0 40px rgba(34,197,94,.45)"
            }
    
        ],{
    
            duration:2000
    
        });
    
    },2200);
    
    </script>
    <style>
        /*==============================
RIPPLE EFFECT
==============================*/

.btn{

position:relative;
overflow:hidden;

}

.ripple{

position:absolute;

width:10px;
height:10px;

background:rgba(255,255,255,.5);

border-radius:50%;

transform:translate(-50%,-50%);

animation:ripple .6s linear;

pointer-events:none;

}

@keyframes ripple{

from{

width:0;
height:0;
opacity:1;

}

to{

width:400px;
height:400px;
opacity:0;

}

}
    </style>

</body>
</html>
